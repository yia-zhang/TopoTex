[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topotex"
version = "0.1.0"
description = "TOPOTEX: topology-indexed texture generation (Face Set Latent + UV query + flow matching)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["topotex*"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E741: the moved code keeps the repository's `for l in open(...)` idiom
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["topotex"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
"topotex/data/builder.py" = ["E402"]  # concatenated offline-build stages
