# TOPOTEX FM 10K official configuration — FROZEN (scaling-study decision
# 2026-07-30: face token dimension 384 = the only effective capacity knob,
# +1.3 dB reconstruction, no held-out degradation, better consistency;
# dim512 saturated, depth6/fm512 flat. No further architecture search
# before 10K completion. Topology depth and generator hidden unchanged.
# Generator: Flow Matching / rectified flow (velocity net = the patchified
#            transformer backbone) — the ONLY generator; no other schedule.
# Surface Conditioner: unchanged upstream. UV Query: factorized dense
#            encoder (face-address Linear(D,Dq) + bary MLP + Conv2d patch
#            embed, Dq = cond_dim/4 = 96) — the only implementation;
#            earlier checkpoints require their frozen commit.
# Training: bf16 on the velocity net + packed face-graph batch (K=4,
#           face-count bucket sampler) + CPU-resident data past 300 meshes.
# Model: Surface Conditioner (face tokenizer + face-view cross attention +
#        topology transformer) + Global UV Query Attention decoder + MiniDiT.
# Dataset: canonical / alternative(xatlas) / partial-surface queries
#          (+ held-out smart-uv family, eval only).
# Query sampling: query_probs over (native/full, xatlas/full,
#   native/connected_partial, blender_smart/full) — all UV layouts are
#   training augmentation; generalization = unseen OBJECTS (object split).
# Efficiency: packed face-graph groups (bucketed by face count) + bf16 on
#             the velocity net — measured +54% meshes/sec vs single-mesh.
# Do not edit for research forks — copy.
dataset_root: output/topotex_dataset
seed: 20260729
# surface conditioner
cond_dim: 384
cond_channels: 64
pe_k: 16
cond_heads: 8
cross_depth: 2
topo_depth: 4
query_depth: 4
# UV query encoder: factorized dense (face-address + bary-MLP, Dq = cond_dim / 4)
uv_query_encoder: factorized_dense
uv_texel_ratio: 0.25
image_size: 256
# texture generator
resolution: 256
patch: 8
dit_hidden: 384
dit_depth: 8
dit_heads: 6
# diffusion / training
T: 1000
target_mesh_exposures: 2000
noise_batch: 4
lr: 3.0e-4
warmup: 100
lr_final_frac: 0.1
t_high_frac: 0.5
t_high_min: 700
aux_rgb_weight: 0.1
log_every: 200
ckpt_every: 2000
query_probs: [0.26667, 0.26667, 0.2, 0.26666]
generator: fm
group_size: 4
precision: bf16
