# TOPOTEX OA prototype (canonical single-image observation) — research
# fork of topotex_fm_10k.yaml per its "copy, don't edit" rule.
# ONLY deltas from the frozen baseline recipe:
#   image_encoder: single      -- ONE canonical reference view (view_000)
#                                  through SingleImageEncoder; the baseline
#                                  MultiViewEncoder path is untouched and
#                                  remains the default everywhere else.
#   query_probs: 3-way          -- OA prototype dataset has native / xatlas
#                                  / partial only (no blender_smart family).
#   dataset_root                -- isolated OA data root (never the
#                                  official topotex_data).
# Purpose: OA-100 prototype (overfit1, smoke, canonical-vs-random ablation)
# — NOT the official baseline; see topotex_OA_study/docs/.
dataset_root: /root/youjiaZhang/topotex_data_OA/dataset
seed: 20260729
# surface conditioner
cond_dim: 384
cond_channels: 64
pe_k: 16
cond_heads: 8
cross_depth: 2
topo_depth: 4
query_depth: 4
uv_query_encoder: factorized_dense
uv_texel_ratio: 0.25
image_size: 256
image_encoder: single
# texture generator
resolution: 256
patch: 8
dit_hidden: 384
dit_depth: 8
dit_heads: 6
# diffusion / training
T: 1000
target_mesh_exposures: 2000
noise_batch: 4
lr: 3.0e-4
warmup: 100
lr_final_frac: 0.1
t_high_frac: 0.5
t_high_min: 700
aux_rgb_weight: 0.1
log_every: 200
ckpt_every: 2000
query_probs: [0.5, 0.3, 0.2]
generator: fm
group_size: 4
precision: bf16
